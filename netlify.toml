# Workaround: explicitly install the OpenNext v5 adapter because auto-detection did not provision the SSR function.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Use Netlify UI to set DATABASE_URL, APP_SESSION_SECRET, APP_SETUP_KEY.
# The project also needs public visitor access when ready.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set DATABASE_URL, APP_SESSION_SECRET, APP_SETUP_KEY in Netlify UI
# with Functions/Builds scopes. Never place credentials in this file.
